<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Face clusters</title>
    <link rel="stylesheet" href="face-clusters-report.css">
</head>

<body>
    <main id="report">
        <div class="report-header">
            <h1>Face Clusters</h1>
            <p id="report-status">Loading...</p>
            <div class="person-filter-control">
                <label for="person-filter">Person</label>
                <select id="person-filter" hidden></select>
                <button id="person-filter-trigger" type="button" class="person-filter-trigger" aria-haspopup="true" aria-expanded="false" aria-controls="person-filter-menu">
                    <span id="person-filter-label">Select person...</span>
                    <span class="person-filter-chevron" aria-hidden="true"></span>
                </button>
                <div id="person-filter-menu" class="person-filter-menu" role="radiogroup" aria-labelledby="person-filter-label" hidden></div>
            </div>
        </div>
        <div id="clusters"></div>
    </main>

    <!-- DATA generated by main() -->
    <script src="image-links-clusters.js"></script>

    <!-- Fixed renderer -->
    <script src="face-clusters-report.js"></script>
</body>

</html>
