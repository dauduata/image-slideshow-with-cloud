<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Management</title>
    <link rel="stylesheet" href="/person-management/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
</head>

<body>
    <main>
        <!-- PAGE 1: Generate Image from Cloud -->
        <section id="page-generate" class="page" style="display: none;">
            <header>
                <div>
                    <p class="eyebrow">IMAGE EXTRACTION</p>
                    <h1>Generate Image from Cloud</h1>
                </div>
            </header>

            <div class="form-section">
                <label for="cloud-url">URL</label>
                <div class="input-group">
                    <input id="cloud-url" type="text" placeholder="Public cloud folder URL (Google Drive or OneDrive)">
                    <button id="open-url-btn" type="button">Open URL</button>
                </div>
                <p class="help-text">Paste a shared Google Drive or OneDrive folder URL</p>
            </div>

            <div class="action-section">
                <button id="generate-btn" type="button" class="primary-btn">Generate</button>
            </div>

            <div class="log-section">
                <div class="log-header">
                    <span>Job Log</span>
                    <button id="clear-log-btn" type="button" class="small-btn">Clear</button>
                </div>
                <textarea id="job-log" readonly></textarea>
            </div>

            <div class="nav-section">
                <button id="go-to-gallery-btn" type="button" class="nav-btn" disabled>Go to Gallery</button>
            </div>
        </section>

        <!-- PAGE 2: Gallery -->
        <section id="page-gallery" class="page" style="display: none;">
            <div class="gallery-layout">
                <aside id="labeling-panel" class="labeling-panel">
                    <button id="collapse-labeling-btn" type="button" class="collapse-btn" aria-label="Collapse labeling panel">←</button>
                    <div class="labeling-content">
                        <p class="eyebrow">LABELING</p>
                        <button id="source-url-btn" type="button" class="source-url">Source URL</button>
                        <div class="panel-actions">
                            <button id="labeling-btn" type="button" class="primary-btn">Let's labeling</button>
                            <button id="public-website-btn" type="button" class="public-website-btn">Public Website</button>
                        </div>
                        <div class="log-section">
                            <div class="log-header"><span>Log</span><button id="clear-label-log-btn" type="button" class="small-btn">Clear</button></div>
                            <textarea id="label-log" readonly></textarea>
                        </div>
                    </div>
                </aside>
                <button id="expand-labeling-btn" type="button" class="expand-btn" aria-label="Expand labeling panel">→</button>
                <section class="gallery-panel">
                    <header>
                        <div>
                            <h1>Gallery on Backend</h1>
                        </div>
                    </header>
                    <div class="gallery-controls">
                        <label for="person-filter">Person</label>
                        <div class="person-filter-control">
                            <select id="person-filter" multiple hidden></select>
                            <button id="person-filter-trigger" type="button" class="person-filter-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="person-filter-menu">
                                <span id="person-filter-label">Select people...</span>
                                <span class="person-filter-chevron" aria-hidden="true"></span>
                            </button>
                            <div id="person-filter-menu" class="person-filter-menu" role="listbox" aria-multiselectable="true" aria-labelledby="person-filter-label" hidden></div>
                        </div>
                        <label for="alias-input">Alias</label>
                        <div class="alias-controls"><input id="alias-input" type="text" disabled><button id="update-alias-btn" type="button" disabled>Update</button></div>
                    </div>
                    <div id="gallery-container" class="gallery-container"><p id="gallery-status">Loading gallery...</p></div>
                </section>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="/person-management/app.js"></script>
</body>

</html>
