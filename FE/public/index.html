<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <header>
      <h1>JL at Bao Loc - 2026</h1>
      <div class="header-tools">
        <div class="meta" id="meta">Loading</div>
        <button class="go-to-button" id="go-to-button" type="button" disabled>Go to</button>
      </div>
    </header>
    <div class="filter-tools">
      <label for="person-filter">Person</label>
      <div class="person-filter-control">
        <select id="person-filter" multiple hidden>
        <option value="all">All persons</option>
        <option value="no-person">No Person</option>
        </select>
        <button id="person-filter-trigger" type="button" class="person-filter-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="person-filter-menu">
          <span id="person-filter-label">Select people...</span>
          <span class="person-filter-chevron" aria-hidden="true"></span>
        </button>
        <div id="person-filter-menu" class="person-filter-menu" role="listbox" aria-multiselectable="true" aria-labelledby="person-filter-label" hidden></div>
      </div>
    </div>
    <section class="gallery-shell" aria-label="Image gallery">
      <div class="gallery swiper" id="gallery">
        <div class="swiper-wrapper"></div>
        <!-- <div class="swiper-pagination"></div> -->
        <button class="swiper-button-prev" type="button" aria-label="Ảnh trước"></button>
        <button class="swiper-button-next" type="button" aria-label="Ảnh tiếp theo"></button>
      </div>
    </section>
    <p id="status" role="status">Loading images...</p>
  </main>
  <dialog id="go-to-dialog" aria-labelledby="go-to-title">
    <form method="dialog" id="go-to-form">
      <h2 id="go-to-title">Go to image</h2>
      <label for="image-index">Image index</label>
      <input id="image-index" name="imageIndex" type="number" min="1" required>
      <div class="dialog-actions">
        <button type="button" id="go-to-cancel">Cancel</button>
        <button type="submit">Go to</button>
      </div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="seriesData.js"></script>
  <script src="app.js"></script>
</body>

</html>
